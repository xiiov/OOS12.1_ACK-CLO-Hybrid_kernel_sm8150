name: Build OnePlus 7 Pro SukiSU-Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 下载你的内核源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 2. 安装系统依赖与官方 Clang-12 编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang-12 lld-12 llvm-12
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-12 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-12 100

      - name: 3. 引入 SukiSU-Ultra 驱动 (4.14 老内核兼容版)
        run: |
          set -e
          HOST="github.com"
          REPO="SukiSU-Ultra/SukiSU-Ultra.git"
          git clone --depth=1 -b v1.2.1 "https://${HOST}/${REPO}" SukiSU
          bash SukiSU/kernel/setup.sh
          ls -la drivers/kernelsu

      - name: 4. 修复高通相机头文件声明并写入 KSU 配置
        run: |
          sed -i '1i struct cam_dump_req_cmd;' drivers/media/platform/msm/camera/cam_core/cam_context.h
          DEFCONFIG="arch/arm64/configs/vendor/sm8150-perf_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $DEFCONFIG

      - name: 5. 使用 Clang-12 正式编译内核
        run: |
          export PATH="/usr/lib/llvm-12/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: 6. 打包成刷机包 (AnyKernel3)
        run: |
          HOST="github.com"
          AK3="osm0sis/AnyKernel3.git"
          git clone --depth=1 "https://${HOST}/${AK3}"
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra-OP7Pro.zip * -x .git README.md *placeholder

      - name: 7. 上传编译好的刷机包供下载
        uses: actions/upload-artifact@v5
        with:
          name: SukiSU-Ultra-OP7Pro
          path: SukiSU-Ultra-OP7Pro.zip
