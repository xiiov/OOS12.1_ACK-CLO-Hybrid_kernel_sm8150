name: Build OnePlus 7 Pro KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 下载你的内核源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 2. 安装编译器与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 3. 自动运行 curl 引入 KernelSU Next 驱动
        run: |
          curl -LSs "https://githubusercontent.com" | bash -

      - name: 4. 自动向配置文件写入 KernelSU Next 开关
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/sm8150-perf_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $DEFCONFIG

      - name: 5. 开始正式编译内核
        run: |
          make -j$(nproc) O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: 6. 打包成刷机包 (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KernelSU-Next-OP7Pro.zip * -x .git README.md *placeholder

      - name: 7. 上传编译好的刷机包供下载
        uses: actions/upload-artifact@v5
        with:
          name: KernelSU-Next-OP7Pro
          path: KernelSU-Next-OP7Pro.zip
